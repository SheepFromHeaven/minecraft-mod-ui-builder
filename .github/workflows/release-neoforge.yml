name: Release neoforge-runtime (manual)

# Dispatch from any branch — the workflow auto-detects the version from
# gradle.properties and the ref from the branch you dispatch from.
#
# The only optional input is 'tag': provide it to re-release a specific
# existing GitHub release tag (e.g. neoforge-runtime-v0.3.0) instead of
# using the current branch HEAD.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional: re-release a specific tag (e.g. neoforge-runtime-v0.3.0). Leave empty to release the current branch."
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  release-neoforge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neoforge-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "$TAG" ]; then
            echo "version=${TAG#neoforge-runtime-v}" >> "$GITHUB_OUTPUT"
          else
            version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ github.event.inputs.tag }}

      - name: Fetch release notes (tag mode only)
        id: notes
        if: github.event.inputs.tag != ''
        run: |
          body=$(gh release view "$TAG" --json body --jq .body)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }}

      - name: Publish to Modrinth
        run: ./gradlew modrinth -Pmod_version=${{ steps.version.outputs.version }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_NOTES: ${{ steps.notes.outputs.body }}

      - name: Attach jars to GitHub release (tag mode only)
        if: github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            neoforge-runtime/build/libs/*.jar
