name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      neoforge--release_created: ${{ steps.release.outputs['neoforge-runtime--release_created'] }}
      neoforge--tag_name: ${{ steps.release.outputs['neoforge-runtime--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-neoforge:
    needs: release-please
    if: needs.release-please.outputs.neoforge--release_created == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neoforge-runtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${TAG#neoforge-runtime-v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ needs.release-please.outputs.neoforge--tag_name }}

      - name: Fetch release notes
        id: notes
        run: |
          body=$(gh release view "$TAG" --json body --jq .body)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ needs.release-please.outputs.neoforge--tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }}

      - name: Publish to Modrinth
        run: ./gradlew modrinth -Pmod_version=${{ steps.version.outputs.version }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_NOTES: ${{ steps.notes.outputs.body }}

      - name: Publish to GitHub Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -Pmod_version=${{ steps.version.outputs.version }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach jars to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.neoforge--tag_name }}
          files: |
            neoforge-runtime/build/libs/*.jar
