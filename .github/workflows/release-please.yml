name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      neoforge--release_created: ${{ steps.release.outputs['neoforge-runtime--release_created'] }}
      neoforge--tag_name: ${{ steps.release.outputs['neoforge-runtime--tag_name'] }}
      webapp--release_created: ${{ steps.release.outputs['webapp--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When one package releases, the other package's open release PR has a stale
  # .release-please-manifest.json (it was written when the sibling was at an older
  # version). Release-please sees the generated content as identical to what is
  # already in that PR and skips updating it, leaving the conflict permanently.
  # Fix: close every remaining open release-please PR, then re-trigger this workflow
  # via workflow_dispatch so release-please regenerates them fresh with the current
  # manifest. (Closing + re-creation cannot happen in a single run — the dispatch
  # fires a new run on the same SHA.)
  refresh-stale-release-prs:
    needs: release-please
    runs-on: ubuntu-latest
    if: >
      needs.release-please.outputs.neoforge--release_created == 'true' ||
      needs.release-please.outputs.webapp--release_created == 'true'
    steps:
      - name: Close stale sibling release PRs
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          prs=$(gh pr list \
            --repo "${{ github.repository }}" \
            --label "autorelease: pending" \
            --json number \
            --jq '.[].number')
          closed=0
          for pr in $prs; do
            gh pr close "$pr" \
              --repo "${{ github.repository }}" \
              --comment "Closed automatically: sibling package released and manifest is now stale. Release-please will reopen with an updated manifest."
            closed=$((closed + 1))
          done
          # Re-trigger release-please so it recreates the PR immediately on the
          # current SHA rather than waiting for the next push.
          if [ "$closed" -gt 0 ]; then
            gh workflow run release-please.yml \
              --repo "${{ github.repository }}" \
              --ref "${{ github.ref_name }}"
          fi

  release-neoforge:
    needs: release-please
    if: needs.release-please.outputs.neoforge--release_created == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neoforge-runtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${TAG#neoforge-runtime-v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ needs.release-please.outputs.neoforge--tag_name }}

      - name: Fetch release notes
        id: notes
        run: |
          body=$(gh release view "$TAG" --json body --jq .body)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ needs.release-please.outputs.neoforge--tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }}

      - name: Publish to Modrinth
        run: ./gradlew modrinth -Pmod_version=${{ steps.version.outputs.version }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_NOTES: ${{ steps.notes.outputs.body }}

      - name: Publish to GitHub Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -Pmod_version=${{ steps.version.outputs.version }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach jars to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.neoforge--tag_name }}
          files: |
            neoforge-runtime/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
