name: neoforge-runtime compile

on:
  pull_request:
    paths:
      - "neoforge-runtime/**"
      - ".github/workflows/neoforge-compile.yml"
  push:
    branches: [main]
    paths:
      - "neoforge-runtime/**"
      - ".github/workflows/neoforge-compile.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neoforge-runtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew compileJava compileTestJava
