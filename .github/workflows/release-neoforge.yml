name: Release neoforge-runtime (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach jars to (e.g. neoforge-runtime-v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  release-neoforge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neoforge-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${TAG#neoforge-runtime-v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.inputs.tag }}

      - name: Build
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }}

      - name: Attach jars to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            neoforge-runtime/build/libs/*.jar
