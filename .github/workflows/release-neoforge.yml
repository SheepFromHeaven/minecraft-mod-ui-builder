name: Release neoforge-runtime (manual)

# Two dispatch modes:
#   Tag mode:    fill in 'tag' (e.g. neoforge-runtime-v0.3.0). Checks out that tag,
#                extracts the version from it, and fetches release notes from the
#                GitHub release. Use this for main-branch releases created by
#                release-please.
#   Branch mode: leave 'tag' empty; fill in 'ref' (e.g. mc/1.21.1) and 'version'
#                (e.g. 0.12.2). Checks out the branch HEAD, publishes with the given
#                version, and skips release-notes / GitHub-release attachment. Use
#                this for maintenance-branch releases.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. neoforge-runtime-v0.3.0). Leave empty to use branch mode."
        required: false
        default: ""
      ref:
        description: "Branch to build from — branch mode only (e.g. mc/1.21.1)."
        required: false
        default: ""
      version:
        description: "Version to publish — branch mode only (e.g. 0.12.2)."
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  release-neoforge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neoforge-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.event.inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "$TAG" ]; then
            echo "version=${TAG#neoforge-runtime-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ github.event.inputs.tag }}
          VERSION: ${{ github.event.inputs.version }}

      - name: Fetch release notes (tag mode only)
        id: notes
        if: github.event.inputs.tag != ''
        run: |
          body=$(gh release view "$TAG" --json body --jq .body)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }}

      - name: Publish to Modrinth
        run: ./gradlew modrinth -Pmod_version=${{ steps.version.outputs.version }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_NOTES: ${{ steps.notes.outputs.body }}

      - name: Publish to GitHub Packages
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://maven.pkg.github.com/SheepFromHeaven/minecraft-mod-ui-builder/sheepfromheaven/screenspec/screenspec-neoforge/${{ steps.version.outputs.version }}/screenspec-neoforge-${{ steps.version.outputs.version }}.jar")
          if [ "$status" != "404" ]; then
            echo "Version ${{ steps.version.outputs.version }} already published to GitHub Packages (status $status), skipping."
          else
            ./gradlew publishAllPublicationsToGitHubPackagesRepository -Pmod_version=${{ steps.version.outputs.version }}
          fi
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach jars to GitHub release (tag mode only)
        if: github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            neoforge-runtime/build/libs/*.jar
